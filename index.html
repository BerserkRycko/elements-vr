<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Diorama AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    /* Estilos para el menú desplegable */
    .custom-select-wrapper {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .custom-select-wrapper label {
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.9rem;
    }

    #model-select {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      color: #333;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #model-select:hover {
      border-color: #007bff;
      background: #fff;
    }
  </style>
</head>
<body style="margin: 0; background-color: #111; overflow: hidden;">

  <!-- Menú moderno para elegir objeto -->
  <div class="custom-select-wrapper">
    <label for="model-select">SELECCIONA UN ELEMENTO:</label>
    <select id="model-select">
      <option value="semaforo.glb" selected>Semáforo</option>
      <option value="abandoned_building.glb">Edificio Abandonado</option>
      <option value="building_set.glb">Set de Edificios</option>
      <option value="building.glb">Edificio Genérico</option>
      <option value="buildings.glb">Grupo de Edificios</option>
      <option value="ccity_building_set_1.glb">Set Ciudad 1</option>
      <option value="free_london_skyscraper.glb">Rascacielos Londres</option>
      <option value="office_building.glb">Edificio de Oficinas</option>
      <option value="plano_de_carretera.glb">Plano de Carretera</option>
      <option value="road_hd.glb">Carretera HD</option>
      <option value="road.glb">Carretera Simple</option>
      <option value="street_road.glb">Calle Urbana</option>
    </select>
  </div>

  <model-viewer 
    id="ar-viewer"
    src="semaforo.glb" 
    alt="Objeto 3D para diorama"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1.5"
    scale="0.05 0.05 0.05"
    style="width: 100vw; height: 100vh;">
    
    <button slot="ar-button" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
      VER EN MI MESA 📱
    </button>
  </model-viewer>

  <script>
    const select = document.getElementById('model-select');
    const viewer = document.getElementById('ar-viewer');

    select.addEventListener('change', (event) => {
      viewer.src = event.target.value;
    });
  </script>

</body>
</html>
