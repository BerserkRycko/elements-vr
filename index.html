  <model-viewer 
    id="ar-viewer"
    src="semaforo.glb" 
    alt="Objeto 3D para diorama"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1.5"
    scale="0.05 0.05 0.05" 
    style="width: 100vw; height: 100vh;">
    
    <!-- ... existing code ... -->
    <button slot="ar-button" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px;">
      VER EN MI MESA 📱
    </button>
  </model-viewer>

  <!-- Botón para tomar captura de pantalla del visor 3D -->
  <button id="capture-btn" style="position: absolute; bottom: 90px; right: 20px; z-index: 20; padding: 12px; background: #ff4757; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center;">
    📷
  </button>

  <script>
    const select = document.getElementById('model-select');
    const viewer = document.getElementById('ar-viewer');
    const captureBtn = document.getElementById('capture-btn');

    select.addEventListener('change', (event) => {
      viewer.src = event.target.value;
    });

    // Función para tomar y descargar la captura
    captureBtn.addEventListener('click', async () => {
      try {
        // Obtenemos el blob (la imagen) del model-viewer
        const blob = await viewer.toBlob({ mimeType: 'image/png', idealAspect: true });
        
        // Creamos una URL temporal para el blob
        const url = URL.createObjectURL(blob);
        
        // Creamos un enlace invisible para forzar la descarga
        const a = document.createElement('a');
        a.href = url;
        a.download = `captura_diorama_${Date.now()}.png`; // Nombre del archivo
        document.body.appendChild(a);
        a.click();
        
        // Limpiamos
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
      } catch (error) {
        console.error("Error al capturar la imagen:", error);
        alert("Hubo un problema al tomar la captura.");
      }
    });
  </script>

</body>
</html>
